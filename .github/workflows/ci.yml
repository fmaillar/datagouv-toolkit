name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            requests \
            pandas \
            pytest \
            pytest-cov \
            ruff \
            mypy \
            bandit

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy . --ignore-missing-imports

      - name: Bandit
        run: bandit -q *.py

      - name: Tests and coverage
        run: |
          pytest \
            --cov=datagouv \
            --cov=catalog_stats \
            --cov=normalize \
            --cov=inspect_csv \
            --cov=download_resources \
            --cov=dataset_workflow \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -q
