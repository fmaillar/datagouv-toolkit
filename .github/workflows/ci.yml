name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy . --ignore-missing-imports

      - name: Bandit
        run: bandit -q *.py

      - name: Package build
        run: |
          python -m build
          python -m twine check dist/*

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Tests and coverage
        run: |
          pytest \
            --cov=cli \
            --cov=datagouv \
            --cov=catalog_stats \
            --cov=normalize \
            --cov=inspect_csv \
            --cov=download_resources \
            --cov=dataset_workflow \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -q
